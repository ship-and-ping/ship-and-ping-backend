name: web
on:
  pull_request:
    paths: ['web/**', 'docs/specs/sanitize-vectors.json', 'supabase/tests/sanitize_vectors.sql', '.github/workflows/web.yml']
  push:
    branches: [main]
    paths: ['web/**', 'docs/specs/sanitize-vectors.json', 'supabase/tests/sanitize_vectors.sql', '.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build Pages and verify the deployed connection policy
        env:
          VITE_SUPABASE_URL: https://fixture.supabase.co
          VITE_INGEST_URL: https://ship-and-ping-ingest.fixture.workers.dev
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ format('{0}_{1}_{2}', 'sb', 'publishable', 'ci-fixture') }}
        run: |
          npm run build -- --mode pages
          grep -F "connect-src $VITE_SUPABASE_URL $VITE_INGEST_URL" dist/_headers
