name: worker
on:
  push:
    paths: ['worker/**', 'docs/specs/sanitize-vectors.json', '.github/workflows/worker.yml']
  pull_request:
    paths: ['worker/**', 'docs/specs/sanitize-vectors.json', '.github/workflows/worker.yml']
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked
      - name: T40 digest escaping mutation and CRLF previews
        run: |
          sed -i 's/$/\r/' ../docs/design/mail/alert-preview/*.html
          cargo test --locked --lib notify::tests::previews_match_rendered_mail -- --exact
          git restore ../docs/design/mail/alert-preview
          sed -i 's/escape(&context(n)),/context(n),/' src/notify.rs
          if cargo test --locked --lib notify::tests::digest_counts_overflow_and_links_to_apps -- --exact > /tmp/t40-digest.log 2>&1; then
            exit 1
          fi
          cat /tmp/t40-digest.log
          grep -F 'test notify::tests::digest_counts_overflow_and_links_to_apps ... FAILED' /tmp/t40-digest.log
          grep -F 'assertion failed' /tmp/t40-digest.log
          git restore src/notify.rs
      - run: cargo test --locked --release diagnostic_batch_budget -- --nocapture
      - run: cargo install worker-build --version 0.9.0 --locked
      - run: worker-build --release
      - run: npm install --prefix target/workerd --no-save workerd@1.20261123.1
      - run: cargo test --locked --test http -- --ignored
      - run: cargo run --locked --release --example bench
      - run: npm install --prefix target/wrangler --no-save wrangler@4.168.0
      - run: target/wrangler/node_modules/.bin/wrangler deploy --dry-run --env production
      - run: python3 bench_http.py --start-local
