<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쉽앤핑 화면 전후 비교</title>
<link rel="stylesheet" href="../../../web/src/styles/tokens.css">
<style>
*{box-sizing:border-box}body{font:1rem/1.6 var(--sp-font);background:var(--sp-bg);color:var(--sp-ink);margin:0;padding:1rem}
header,main{max-width:1440px;margin:auto}h1{margin:0}form,main{display:flex;flex-wrap:wrap;gap:1rem}
form{margin-block:1rem}label{display:grid}select{min-height:44px;font:inherit;background:var(--sp-surface);color:var(--sp-ink)}
figure{margin:0;flex:1;min-width:0}figcaption{font-weight:700}img{width:100%;height:auto;border:1px solid var(--sp-line)}
@media(max-width:640px){main{display:grid}}
</style>
<header><h1>쉽앤핑 화면 전후 비교</h1><form>
<label>화면과 상태<select id="scene"><optgroup label="사용 흐름 · T41" id="chart">
<option value="00-many">사용 기록 많음</option><option value="01-few">사용 기록 적음</option><option value="02-cluster">실패가 몰린 구간</option>
<option value="03-scrolled">본문을 900px 내린 회원 메뉴</option>
</optgroup><optgroup label="3차 · T37" id="qa3"></optgroup><optgroup label="D6" id="d6"></optgroup></select></label>
<label>보기 조건<select id="profile">
<option value="1440-light" selected>PC · 1440 · 밝게</option>
<option value="1280-dark">노트북 · 1280 · 어둡게</option>
<option value="390-light">휴대폰 · 390 · 밝게</option>
<option value="390-dark">휴대폰 · 390 · 어둡게 · 글자 200% · 동작 줄이기</option>
</select></label></form><p><a href="2026-11-26-qa3.md">3차 QA 기록</a> · <a href="motion/landing.webm">소개 페이지 움직임 보기</a></p></header>
<nav id="chart-input" aria-label="390px 사용 흐름 검수">390px 사용 흐름 ·
<a href="chart-after/touch-390.jpg">터치로 끈 구간</a> ·
<a href="chart-after/mouse-390.jpg">마우스로 가리킨 구간</a> ·
<a href="chart-after/keyboard-restored-390.jpg">마우스 이탈 후 키보드 구간</a> ·
<a href="chart-after/isolated-390.jpg">마지막 측정점 라벨</a></nav>
<main><figure><figcaption>수정 전</figcaption><a id="old"><img alt="수정 전 원본 열기"></a></figure>
<figure><figcaption>수정 후</figcaption><a id="updated"><img alt="수정 후 원본 열기"></a></figure></main>
<script>
const scenes = [
  ["소개","normal"],["로그인","normal"],["내 앱","normal"],["빈 앱 목록","empty"],
  ["앱 등록","normal"],["연결 대기","waiting"],["앱 홈","normal"],["첫 기록 대기","waiting"],
  ["문제 있는 홈","failure"],["기능 상세","normal"],["문제 상세 · 실패","failure"],
  ["문제 상세 · 느림","slow"],["문제 상세 · 결과 미확인","unconfirmed"],["문제 상세 · 해결","resolved"],
  ["깊게 보기","normal"],["알림 설정","normal"],["알림 목록 불러오기","loading"],
  ["알림 목록 오류","error"],["기록 로딩","loading"],["기록 오류","error"]
];
const scene = document.querySelector("#scene"), profile = document.querySelector("#profile");
const currentScenes = [
  ["PC 승인 대기","02-mail"],["휴대폰 숫자 입력","31-approval"],["PC 요청 만료","32-expired"],
  ["PC 요청 거절","33-denied"],["휴대폰 승인 완료","34-approval-ok"],["휴대폰 거절 완료","35-approval-deny"],
  ["연결 요청문","36-prompt"],["복사 실패 · 키 가림","37-masked"],["새 키로 교체","38-replacement"],["슬랙 미설정","39-unconfigured"]
];
currentScenes.forEach(([label,file])=>document.querySelector("#qa3").append(new Option(label,file)));
scenes.forEach(([label,state],i)=>document.querySelector("#d6").append(new Option(label,String(i).padStart(2,"0")+"-"+state)));
scene.selectedIndex=0;
function compare(){
  const current = scene.selectedOptions[0].parentElement.id === "qa3";
  const chart = scene.selectedOptions[0].parentElement.id === "chart";
  for (const i of [1,3]) profile.options[i].disabled = chart;
  if (profile.selectedOptions[0].disabled) profile.selectedIndex = profile.selectedIndex === 3 ? 2 : 0;
  profile.options[1].value = current ? "1440-dark" : "1280-dark";
  profile.options[1].text = current ? "PC · 1440 · 어둡게" : "노트북 · 1280 · 어둡게";
  profile.options[3].text = current ? "휴대폰 · 390 · 어둡게 · 동작 줄이기" : "휴대폰 · 390 · 어둡게 · 글자 200% · 동작 줄이기";
  for(const [id,phase] of [["old","before"],["updated","after"]]){
    const link=document.getElementById(id);
    link.href=(chart ? "chart-" : current ? "qa3-" : "")+phase+"/"+scene.value+"-"+profile.value+".jpg";
    link.firstElementChild.src=link.href;
  }
}
document.querySelector("form").addEventListener("change",compare);
compare();
</script>
</html>
