<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>대시보드 B안 구현 비교 · 쉽앤핑</title>
<style>
*{box-sizing:border-box}body{margin:0 auto;max-width:1800px;padding:24px;font:16px/1.5 system-ui,sans-serif;background:#faf9fc;color:#1e1535;word-break:keep-all}
h1{font-size:1.75rem}nav,form{display:flex;gap:16px;align-items:end;flex-wrap:wrap}select{display:block;min-height:44px;font:inherit}
.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}figure{margin:16px 0}figcaption{font-weight:700;padding:8px 0}
img{display:block;max-width:100%;height:auto;border:1px solid #d4cedf}a{color:inherit}details{margin-top:12px}summary{cursor:pointer}
@media(max-width:760px){.panels{grid-template-columns:1fr}body{padding:16px}}
</style></head><body><main>
<h1>대시보드 B안 구현 비교</h1>
<p>2026년 11월 27일 18시 기준 트루바 예시 기록. 구현 전후는 같은 데이터로 Windows Edge에서 실행한 React 앱이다.</p>
<form><label>화면<select id="scene"><option value="home">앱 홈 · 문제</option><option value="healthy">앱 홈 · 정상</option>
<option value="empty">앱 홈 · 첫 기록 대기</option><option value="feature">기능 상세</option><option value="expanded">휴대폰 그래프 펼침</option>
<option value="issue">문제 상세</option><option value="alerts">알림 설정</option></select></label>
<label>너비<select id="width"><option>1440</option><option>390</option></select></label>
<label>테마<select id="theme"><option value="light">밝게</option><option value="dark">어둡게</option></select></label></form>
<div class="panels"><figure><figcaption>레퍼런스 · 토스 공개 앱 화면</figcaption><a id="ref"><img alt="토스 공개 송금 화면"></a></figure>
<figure><figcaption>선택한 시안 · B</figcaption><a id="design"><img alt="선택한 B 시안"></a></figure>
<figure><figcaption>구현 · 실제 앱</figcaption><a id="app"><img alt="구현 후 실제 앱"></a></figure></div>
<details><summary>같은 조건의 구현 전 화면</summary><a id="before"><img alt="구현 전 실제 앱"></a></details>
<nav><a href="../../dashboard-2026-11-27/index.html">시안 비교로 돌아가기</a>
<a href="comparison-1440.png">1440px 3단 비교 PNG</a><a href="comparison-390.png">390px 3단 비교 PNG</a></nav>
<script>
const form = document.querySelector("form");
const scene = document.getElementById("scene"), width = document.getElementById("width"), theme = document.getElementById("theme");
function render() {
  const expanded = scene.value === "expanded";
  if (expanded) width.value = "390";
  width.disabled = expanded;
  const name = "-" + width.value + "-" + theme.value + ".png";
  const design = "../../dashboard-2026-11-27/";
  for (const [id,src] of [
    ["ref", design + "refs/toss-app-" + width.value + ".png"],
    ["design", design + "option-b/" + scene.value + name],
    ["app", "after/" + scene.value + name],
    ["before", "before/" + (expanded ? "feature" : scene.value) + name],
  ]) {
    const link = document.getElementById(id);
    link.href = src;
    link.querySelector("img").src = src;
  }
}
form.addEventListener("change",render);
render();
</script></main></body></html>
